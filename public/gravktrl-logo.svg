<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Hexagon Border Gradient -->
    <linearGradient id="hex-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Orbital Ring Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#db2777" stop-opacity="1" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.9" />
    </linearGradient>

    <!-- Arrow Core Gradient -->
    <linearGradient id="arrow-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyberpunk Obsidian Hexagon Base -->
  <polygon
    points="256,24 456,139 456,373 256,488 56,373 56,139"
    fill="url(#bg-grad)"
    stroke="url(#hex-border)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Subtle Internal Grid Geometry -->
  <polygon
    points="256,54 426,152 426,360 256,458 86,360 86,152"
    fill="none"
    stroke="#1e293b"
    stroke-width="2"
    stroke-dasharray="8 8"
    opacity="0.4"
  />

  <!-- Tilted 3D Orbital Gyro Ring -->
  <ellipse
    cx="256"
    cy="256"
    rx="170"
    ry="64"
    fill="none"
    stroke="url(#orbit-grad)"
    stroke-width="9"
    stroke-linecap="round"
    transform="rotate(-28 256 256)"
    filter="url(#soft-glow)"
  />

  <!-- Terminal Brackets { } Framing Center Core -->
  <!-- Left Bracket { -->
  <path
    d="M 160 190 Q 140 190 140 220 L 140 240 Q 140 256 125 256 Q 140 256 140 272 L 140 292 Q 140 322 160 322"
    fill="none"
    stroke="#06b6d4"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft-glow)"
  />

  <!-- Right Bracket } -->
  <path
    d="M 352 190 Q 372 190 372 220 L 372 240 Q 372 256 387 256 Q 372 256 372 272 L 372 292 Q 372 322 352 322"
    fill="none"
    stroke="#06b6d4"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#soft-glow)"
  />

  <!-- Center Levitating Antigravity Core (Upward Arrow / Chevron) -->
  <path
    d="M 256 120 L 324 235 L 285 235 L 285 330 L 227 330 L 227 235 L 188 235 Z"
    fill="url(#arrow-grad)"
    filter="url(#neon-glow)"
  />

  <!-- Orbit Particle Nodes -->
  <circle cx="106" cy="336" r="7" fill="#06b6d4" filter="url(#soft-glow)" />
  <circle cx="406" cy="176" r="7" fill="#db2777" filter="url(#soft-glow)" />
  <circle cx="256" cy="120" r="4" fill="#ffffff" />
</svg>
